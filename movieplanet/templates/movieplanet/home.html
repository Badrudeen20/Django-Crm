{% extends "movieplanet/layout/movie.html" %}


{% block content %}
   <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css" />
   <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">

   <style>
    .card-block {
    font-size: 1em;
    position: relative;
    margin: 0;
    padding: 1em;
    border: none;
    border-top: 1px solid rgba(34, 36, 38, .1);
    box-shadow: none;
     
}
   </style>
    <div class="container-fluid">
       <div class="row">
          <div class="col-md-12 col-sm-12 col-lg-8 ">
            <table id="customer_table"   class="display" style="width:100%">
              <tbody class="row">
    
              </tbody>
            </table>
          </div>
      

          <div class="col-md-12 col-sm-12 col-lg-4">
              <div class="container">
                <div class="row">
                  
                  {% for t in Trands %}
                    <div class="col-md-6 col-sm-12 col-lg-12">
                      <div class="card float-left my-2">
                        <div class="row ">

                          {% if forloop.counter|divisibleby:2 %}
                              <div class="col-7 ">
                                <div class="card-block">                          
                                  <a class="card-text" href="#">{{t.post.name}}</a>
                                </div>
                              </div>
                              <div class="col-5">
                                <img class="d-block w-100" src="{{t.post.image}}" alt="">
                              </div>
                          {% else %}
                              <div class="col-5">
                                <img class="d-block w-100" src="{{t.post.image}}" alt="">
                              </div>
                              <div class="col-7">
                                <div class="card-block">
                                  <a class="card-text" href="#">{{t.post.name}}</a>
                                </div>
                              </div> 
                          {% endif %}     
                        </div>
                      </div>
                    </div>
                  {% endfor %}
                 

             
                </div>
                 
                
                  
                  
              </div>
                  
          </div>
       </div>
        
 
    </div>
   
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>

<!-- <script src="https://cdn.datatables.net/2.2.2/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.2/js/dataTables.buttons.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.2/js/buttons.dataTables.js"></script> -->
<script>

    $(document).ready( function () {
      loadData()
    })
    function loadData(){
      var pgno = 0;
      $('table.display').DataTable({
            "processing" : true,
		        "serverSide" : true,
            "lengthChange": false,
            "pageLength" : 4,
            "oSearch": {"sSearch": "{{request.GET.search}}" },
            "displayStart":("{{request.GET.page}}") ?(4*"{{request.GET.page}}")-4 : 0,
            "ordering": false,
            createdRow:function(row, data, dataIndex){
              let url = baseUrl+"/detail/"+data.name.split(' ').join('+')
              if(data.type=="2"){
                url = baseUrl+"/"+data.name.split(' ').join('+')
              }
              let card  = `<article class="card animated fadeInLeft">
                            <img class="card-img-top img-responsive" src="${data.image}" alt="Deer in nature" />
                            <div class="card-body">
                              <a class="card-text" href="${url}">${data.name}</a>
                            </div>
                          </article>`
              $(row).addClass('col-xl-4 col-sm-6 col-xs-6 col-md-6 col-6  my-2 border-0');
              $(row).html(card);
            },
            ajax: function (data, callback, settings) {
                var api = this.api();
                var search =  api.search() 
                var pageInfo = api.page.info();
                pgno =  pageInfo.page+1;
                let param = '?page='+pgno
                
                if(search){
                  param +='&search='+search
                }
                window.history.replaceState(null, null, param);
                
                $.ajax({
                    url: "{{ settings.BASE_URL }}",
                    method:"POST",
                    headers: {'X-CSRFToken': csrftoken},
                    data:{start:pgno, length:4,search:search,type:'View'}
                }).then ( function( json, textStatus, jqXHR ) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    callback(json);
                });
            },
            // pageLength: 10,
            columns: [
                { data: "image" },
                { data: "name" },
                { data: "rate" },  
            ],
            initComplete: function () {
                // Create the custom button
                const customBtn = $(`
                    <button class="btn btn-sm btn-info">
                        Filter <i class="fa fa-filter me-1"></i> 
                    </button>
                `);

                // Append the button to the filter container
                $('.dataTables_filter').prepend(customBtn);

                // Button click action
                $('#filterBtn').on('click', function () {
                    alert('Custom filter clicked');
                    // You can open a modal or apply custom logic here
                });
            }
            // dom: 'Bfrtip', // B = buttons, f = filter, r = processing, t = table, i = info, p = pagination
            // buttons: [
            //     {
            //         text: 'Filter <i class="fa fa-filter me-1"></i>',
            //         className: 'btn btn-primary',
            //         action: function (e, dt, node, config) {
            //             alert('Add customer clicked');
            //         }
            //     }
            // ],
            
        });
        
    }



</script>

{% endblock %}
