
{% extends "movieplanet/layout/admin.html" %}


{% block content %}
<div class="container d-flex justify-content-center">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css" />

<div class="container mt-2">
    <button  class="btn btn-primary my-2">Add Menu</button>
    <div class="row">
        <div class="col-12">
            <table id="customer_table"  class="display table" style="width:100%">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
  
                </tbody>
            </table>
        </div>

      </div>
  
</div>

<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script> -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
<script>
const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

$(document).ready( function () {
    loadData()
})


function loadData(){
    var pgno = 0;
    $('table.display').DataTable({
        "processing" : true,
        "serverSide" : true,
        pageLength : 4,
        ajax: function (data, callback, settings) {
            var api = this.api();
            var search = api.search() 
            var pageInfo = api.page.info();
            pgno = pageInfo.page+1;
            
            $.ajax({
                url: "{{ settings.BASE_URL }}",
                method:"POST",
                headers: {'X-CSRFToken': csrftoken},
                data:{start:pgno, length:4,search:search,type:'View'}
            }).then ( function( json, textStatus, jqXHR ) {
                console.log(json)
                callback(json);
            });
        },
       
        columns: [
            { data: "id" },
            { data: "name" },
            { data: "action" },
            
        ],
        
    });
}
</script>

{% endblock %}
