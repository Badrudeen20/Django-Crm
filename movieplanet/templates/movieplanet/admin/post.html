<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
<script>
    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    $(document).ready( function () {
        loadData()
    })
    function loadData(){
        var pgno = 0;
        $('table.display').DataTable({
            "processing" : true,
			"serverSide" : true,
            pageLength : 4,
            // scrollX: true,
            // scrollCollapse: true,
            // autoWidth: false,
            ajax: function (data, callback, settings) {
                var api = this.api();
                var search = api.search() 
                var pageInfo = api.page.info();
                pgno = pageInfo.page+1;
                
                $.ajax({
                    url: "{{ settings.BASE_URL }}",
                    method:"PUT",
                    headers: {'X-CSRFToken': csrftoken},
                    //data:{start:pgno, length:4,search:search,type:'View'}
                    data: JSON.stringify({
                        start: pgno,
                        length: 4,
                        search: search,
                        type: 'View'
                    }),
                }).then ( function( json, textStatus, jqXHR ) {
                    console.log(json)
                    // if(json.success){
                    //     $('.action').html(json.action.add)
                    // }
                    callback(json);
                });
            },
            // pageLength: 10,
            columns: [
                { data: "id" },
                { data: "name" },
                { data: "image" },
                { data: "rate" },
                { data: "action" },
                
            ],
         
        });
    }
   

    function deleteModal(id){
        $('#deleteModal').modal('show')
        $("#deleteModal").find('button[type=submit]').attr('onclick',"deleteItem("+id+")")
    }

    function deleteItem(id){
        $.ajax({
            url: '{{ settings.BASE_URL }}', // Replace with your server endpoint
            method: 'PATCH',
            data: JSON.stringify({id:id}),
            headers: {'X-CSRFToken': csrftoken},
            contentType: 'application/json',
            success: function(response) {
                console.log(response)
                $('#deleteModal').modal('hide')
                if(response.status){
                    $('table.display').DataTable().clear().destroy();
                    loadData()
                }
                

            },
            error: function(xhr) {
                console.error('Error submitting form:', xhr.responseText);
            }
        });  
    }
